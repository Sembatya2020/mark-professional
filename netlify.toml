# Netlify configuration for Mark O'Connell — static website
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # No build step needed — this is a plain static site.
  # Publish the project root as-is.
  publish = "."

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "SAMEORIGIN"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "geolocation=(), microphone=(), camera=()"

# Long-cache static assets (CSS / JS / images / fonts)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Custom 404 page (uses index.html as a soft fallback — change to a dedicated 404.html if you create one)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
